name: Windows native foundation

on:
  pull_request:
    branches: [main, 'ui/**']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: windows-x64-whisper
      - name: Verify native x64 and select LLVM for locked bindgen
        run: |
          $hostInfo = rustc -vV
          if ($LASTEXITCODE -ne 0 -or $hostInfo -notcontains 'host: x86_64-pc-windows-msvc') {
            throw 'A native x64 MSVC Rust host is required.'
          }
          # The locked bindgen 0.69 must not silently discover LLVM 22.
          # windows-2022 supplies LLVM 20; fail closed on image drift.
          $llvm = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (!(Test-Path (Join-Path $llvm 'libclang.dll'))) {
            throw 'The Windows LLVM libclang.dll is missing.'
          }
          $clangVersion = & (Join-Path $llvm 'clang.exe') --version
          if ($LASTEXITCODE -ne 0 -or ($clangVersion -join "`n") -notmatch 'clang version 20\.') {
            throw 'The locked Whisper bindings require the selected LLVM 20 toolchain.'
          }
          "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $clangVersion
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw 'CMake is required for whisper.cpp.' }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The existing full browser suite remains in ci.yml. Some release tests
      # exercise Bash, not the Windows app; do not silently skip them here.
      - run: npm run test:unit -- tests/unit/windowsWorkflow.test.ts
      # generate_context! consumes this production dist in native builds.
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets --target x86_64-pc-windows-msvc
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --target x86_64-pc-windows-msvc
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets --features whisper --target x86_64-pc-windows-msvc
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --features whisper --target x86_64-pc-windows-msvc
      # Build the actual app binary with CPU Whisper, not just a test harness.
      # This proves neither model provisioning nor inference. No weights are
      # downloaded, no app is launched, and no installer is published here.
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release --features whisper --target x86_64-pc-windows-msvc
      - name: Diagnose native test loader failures
        if: failure()
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/debug' -Filter 'voxloom_lib-*.exe' -Recurse |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$exe) { Write-Output 'No native test executable was produced.'; exit 0 }
          $readobj = Join-Path $env:LIBCLANG_PATH 'llvm-readobj.exe'
          if (!(Test-Path $readobj)) { throw 'LLVM import inspection tool is unavailable.' }
          $imports = & $readobj --coff-imports $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Native import inspection failed.' }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class LoaderProbe {
            [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
            public static extern IntPtr LoadLibrary(string name);
            [DllImport("kernel32.dll", CharSet = CharSet.Ansi, ExactSpelling = true, SetLastError = true)]
            public static extern IntPtr GetProcAddress(IntPtr module, string name);
            [DllImport("kernel32.dll")]
            public static extern bool FreeLibrary(IntPtr module);
          }
          '@
          $modules = @{}
          $dll = $null
          foreach ($line in $imports) {
            if ($line -match '^\s+Name: (\S+\.dll)$') {
              $dll = $Matches[1]
              $handle = [LoaderProbe]::LoadLibrary($dll)
              $modules[$dll] = $handle
              if ($handle -eq [IntPtr]::Zero) {
                Write-Output "Dependency load failed: $dll; error=$([Runtime.InteropServices.Marshal]::GetLastWin32Error())"
              }
            } elseif ($dll -and $line -match '^\s+Symbol: (\S+)') {
              $symbol = $Matches[1]
              $handle = $modules[$dll]
              if ($handle -ne [IntPtr]::Zero -and [LoaderProbe]::GetProcAddress($handle, $symbol) -eq [IntPtr]::Zero) {
                Write-Output "Missing imported entry point: $dll!$symbol"
              }
            }
          }
          foreach ($handle in $modules.Values) {
            if ($handle -ne [IntPtr]::Zero) { [void][LoaderProbe]::FreeLibrary($handle) }
          }
          Write-Output 'Direct import inspection complete; no application or model was launched.'
